services:
  mysql:
    image: mysql:8.0
    container_name: wsql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: ${DB}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - wsql-nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:latest
    container_name: word-sql
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WP_HOST}
      WORDPRESS_DB_USER: ${WP_USER}
      WORDPRESS_DB_PASSWORD: ${WP_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_NAME}
    volumes:
      - wordpress:/var/www/html
    networks:
      - wsql-nw
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  wordpress:

networks:
  wsql-nw:

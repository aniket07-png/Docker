<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golang 3D Webpage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.75);
            padding: 16px 24px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }

        p {
            margin: 0;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Three.js Library & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info-overlay">
        <h1>Golang 3D Engine</h1>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 2. Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 3. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
        pointLight.position.set(2, 4, 2);
        pointLight.castShadow = true;
        scene.add(pointLight);

        const secondaryLight = new THREE.PointLight(0xf43f5e, 1.5, 50);
        secondaryLight.position.set(-2, -2, -2);
        scene.add(secondaryLight);

        // --- 4. 3D Object (Icosahedron + Wireframe) ---
        const group = new THREE.Group();

        const geometry = new THREE.IcosahedronGeometry(1.2, 1);
        const material = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: false
        });
        const mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);

        // Outer wireframe shell
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });
        const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
        wireframeMesh.scale.setScalar(1.05);
        group.add(wireframeMesh);

        scene.add(group);

        // Grid floor
        const gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // --- 5. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Subtle rotation
            group.rotation.x += 0.005;
            group.rotation.y += 0.008;

            // Floating movement
            group.position.y = Math.sin(Date.now() * 0.0015) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 6. Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
